<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1326"/>
      <stop offset="100%" stop-color="#080B14"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.6"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38BDF8" stroke-width="0.5" stroke-opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Card Background -->
  <rect width="800" height="500" rx="16" fill="url(#bgGrad)"/>
  <rect width="800" height="500" rx="16" fill="url(#grid)"/>
  <rect x="2" y="2" width="796" height="496" rx="14" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Inner Frame -->
  <rect x="24" y="24" width="752" height="452" rx="10" stroke="#8B5CF6" stroke-width="1" stroke-dasharray="8 6" stroke-opacity="0.4"/>

  <!-- Corner Decors -->
  <path d="M 36 60 L 36 36 L 60 36" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  <path d="M 764 60 L 764 36 L 740 36" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  <path d="M 36 440 L 36 464 L 60 464" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  <path d="M 764 440 L 764 464 L 740 464" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>

  <!-- Certificate Emblem -->
  <g transform="translate(400, 160)">
    <circle r="52" fill="#8B5CF6" fill-opacity="0.12"/>
    <circle r="44" stroke="url(#accentGrad)" stroke-width="2"/>
    <!-- Award Ribbon Icon -->
    <path d="M-16 -12 C-16 -24 16 -24 16 -12 C16 4 -16 4 -16 -12 Z" stroke="#38BDF8" stroke-width="3" fill="none"/>
    <circle cx="0" cy="-10" r="14" stroke="#8B5CF6" stroke-width="2.5" fill="#080B14"/>
    <path d="M-5 -10 L-1 -6 L7 -14" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-10 8 L-14 30 L0 22 L14 30 L10 8" stroke="#8B5CF6" stroke-width="2" fill="#080B14"/>
  </g>

  <!-- Typography -->
  <text x="400" y="260" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="24" fill="#FFFFFF" letter-spacing="1">
    ARDUINO EĞİTİMİ &amp; SERTİFİKASI
  </text>

  <text x="400" y="295" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="16" fill="#38BDF8">
    Doğrulanmış Başarı Belgesi
  </text>

  <text x="400" y="340" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#94A3B8">
    Görselinizi bu alana ekleyebilirsiniz (assets/arduino-sertifikasi.jpg)
  </text>

  <!-- Badge Tag -->
  <g transform="translate(400, 400)">
    <rect x="-130" y="-18" width="260" height="36" rx="18" fill="#8B5CF6" fill-opacity="0.15" stroke="#8B5CF6" stroke-width="1"/>
    <circle cx="-100" cy="0" r="4" fill="#10B981"/>
    <text x="-85" y="5" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#E2E8F0">
      Sertifika Mevcut &amp; Kayıtlı
    </text>
  </g>
</svg>
